[capture]
backend = "libpcap"
enabled_backends = ["libpcap", "pfring", "raw_socket", "dpdk", "ebpf"]
snaplen = 65535
promisc = true
read_timeout_ms = 50

[net]
bpf_filter = ""
dynamic_interfaces = true
link_patterns = ["eth*", "ens*", "lo"]
discovery_interval_secs = 2

[service]
hostname = ""
host = "127.0.0.1"
port = 8080
socket_path = ""

[log]
level = "info"
output = "arkime-rust.log"
